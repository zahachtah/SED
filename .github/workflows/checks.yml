name: Model and companion checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.5'
      - uses: julia-actions/cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Julia regression tests
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - name: Fixed-population browser/Julia parity
        run: JULIA="$(command -v julia)" node webapp/test/model.test.cjs

  browser-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Check the distributed page and numerical plots
        run: |
          node webapp/build.mjs --check
          node webapp/test/model.test.cjs
          node webapp/test/plots.test.cjs
      - name: Install browser-check dependencies
        working-directory: webapp
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Desktop/mobile interaction and screenshot checks
        run: node webapp/test/ui.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-browser-screenshots
          path: tmp/companion/
          if-no-files-found: ignore
