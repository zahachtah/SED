name: Publish companion

on:
  push:
    branches: [master]
    paths:
      - index.html
      - webapp/**
      - manuscript/Science_MS_compact.pdf
      - SupplementaryMaterial/SED_Supplementary_Material.pdf
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/configure-pages@v5
      - name: Verify the page source and numerical engine
        run: |
          node webapp/build.mjs --check
          node webapp/test/model.test.cjs
          node webapp/test/solver.test.cjs
          node webapp/test/runner.test.cjs
          node webapp/test/plots.test.cjs
          node webapp/test/publication.test.cjs
      - name: Stage the companion and reading material only
        run: node webapp/build.mjs --pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: tmp/pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
